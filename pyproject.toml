[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbots"
version = "0.1.0"
description = "Unified CLI and shared core for the job-application automation system"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pymongo>=4.6",
]

[project.scripts]
jobbots = "jobbots.app.cli:main"

# Runtime deps (playwright, seleniumbase, jobspy, etc.) are installed from the
# repo-root requirements.txt into the shared .venv; the CLI package itself only
# needs the two deps above so `pip install -e .` stays lightweight.

[tool.setuptools.package-dir]
"" = "."

# Phase 2: jobbots.core now contains the canonical shared core (including
# namespace subpackages such as shared_modules/ that have no __init__.py),
# so use namespace-aware discovery.
[tool.setuptools.packages.find]
where = ["."]
include = ["jobbots*"]
namespaces = true


[tool.pytest.ini_options]
testpaths = ["automation_monorepo/tests"]
