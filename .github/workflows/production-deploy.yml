name: Production Cycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: One production control action
        required: true
        type: choice
        default: run
        options:
          - run
          - sync
          - awake
          - sleep
          - soft-destroy
          - die
          - full-destroy
          - status
          - preflight
          - verify-logins
          - health
          - recover
      confirm_full_destroy:
        description: Exact RESOURCE_PREFIX required for permanent backend deletion
        required: false
        type: string
      confirm_login_check:
        description: Exact RESOURCE_PREFIX required to spend NST quota verifying portal logins
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: linux-lifecycle-production
  cancel-in-progress: false

jobs:
  lifecycle:
    name: ${{ inputs.action }} production cycle
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Validate production target
        run: bash .github/scripts/assert-linux-target.sh
        env:
          TARGET_ENVIRONMENT: production
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          VM_NAME: ${{ vars.VM_NAME }}
          ARTIFACT_PREFIX: production/deploy
      - name: Run one lifecycle controller action
        run: |
          set -euo pipefail
          case "$ACTION" in
            run)
              # One switch: born/wake, sync this release, preflight, then start.
              bash scripts/lifecycle.sh run
              ;;
            sync|awake|sleep|soft-destroy|die|full-destroy|status|preflight|verify-logins|health|recover)
              bash scripts/lifecycle.sh "$ACTION"
              ;;
            *)
              echo "Unsupported action: $ACTION" >&2
              exit 2
              ;;
          esac
        env:
          ACTION: ${{ inputs.action }}
          FULL_DESTROY_CONFIRM: ${{ inputs.confirm_full_destroy }}
          NST_LOGIN_CHECK_CONFIRM: ${{ inputs.confirm_login_check }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          TARGET_ENVIRONMENT: production
          AVAILABILITY_ZONE: ${{ vars.AVAILABILITY_ZONE }}
          VM_NAME: ${{ vars.VM_NAME }}
          # Must match instance-role S3 policy (production/deploy/* only).
          # GitHub env var production/20260613 causes 403 HeadObject on the worker.
          ARTIFACT_PREFIX: production/deploy
          NSTBROWSER_ACTIVE_SLOT: "1"
