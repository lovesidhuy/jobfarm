name: Apply Persistent Linux Infrastructure

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options: [canary, production]
      confirm_resource_prefix:
        description: Type the exact protected RESOURCE_PREFIX after reviewing preflight
        required: true
        type: string
permissions:
  contents: read
  id-token: write

concurrency:
  group: linux-lifecycle-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  apply:
    environment: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Assert protected inputs
        run: |
          bash .github/scripts/assert-linux-target.sh
          test "$CONFIRM_RESOURCE_PREFIX" = "$RESOURCE_PREFIX"
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          VM_NAME: ${{ vars.VM_NAME }}
          ARTIFACT_PREFIX: ${{ vars.ARTIFACT_PREFIX }}
          CONFIRM_RESOURCE_PREFIX: ${{ inputs.confirm_resource_prefix }}
      - name: Apply persistent root
        run: |
          set -euo pipefail
          cat >terraform/persistent/environment.auto.tfvars <<EOF
          aws_region           = "$AWS_REGION"
          availability_zone    = "$AVAILABILITY_ZONE"
          environment          = "$TARGET_ENVIRONMENT"
          deployment_tier      = "$TARGET_ENVIRONMENT"
          resource_prefix      = "$RESOURCE_PREFIX"
          volume_size_gb       = $PERSISTENT_VOLUME_SIZE_GB
          artifact_retention_days = $ARTIFACT_RETENTION_DAYS
          EOF
          terraform -chdir=terraform/persistent init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=${RESOURCE_PREFIX}/persistent.tfstate"
          terraform -chdir=terraform/persistent plan -out=tfplan -lock-timeout=300s
          terraform -chdir=terraform/persistent apply -auto-approve tfplan
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AVAILABILITY_ZONE: ${{ vars.AVAILABILITY_ZONE }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          PERSISTENT_VOLUME_SIZE_GB: ${{ vars.PERSISTENT_VOLUME_SIZE_GB }}
          ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}
