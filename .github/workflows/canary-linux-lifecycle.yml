name: Verify Linux Canary Without Bots

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Canary verification phase
        required: true
        type: choice
        options: [initial, recreated]
      confirm_resource_prefix:
        description: Type the exact protected RESOURCE_PREFIX to verify
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: linux-lifecycle-canary
  cancel-in-progress: false

jobs:
  verify:
    environment: canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Assert canary-only inputs
        run: |
          bash .github/scripts/assert-linux-target.sh
          test "$CONFIRM_RESOURCE_PREFIX" = "$RESOURCE_PREFIX"
          test -n "$NSTBROWSER_TEST_PROFILE_ID"
          test -n "$NSTBROWSER_API_KEY"
          test -n "$CANARY_RECORD_ID"
        env:
          TARGET_ENVIRONMENT: canary
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          VM_NAME: ${{ vars.VM_NAME }}
          ARTIFACT_PREFIX: ${{ vars.ARTIFACT_PREFIX }}
          NSTBROWSER_TEST_PROFILE_ID: ${{ secrets.NSTBROWSER_TEST_PROFILE_ID }}
          NSTBROWSER_API_KEY: ${{ secrets.NSTBROWSER_API_KEY }}
          CANARY_RECORD_ID: ${{ vars.CANARY_RECORD_ID }}
          CONFIRM_RESOURCE_PREFIX: ${{ inputs.confirm_resource_prefix }}
      - name: Store canary-only runtime secret
        run: |
          set -euo pipefail
          secret_id="$(aws secretsmanager list-secrets --filters Key=tag-key,Values=ResourcePrefix Key=tag-value,Values="$RESOURCE_PREFIX" --query 'SecretList[0].ARN' --output text)"
          test -n "$secret_id" && test "$secret_id" != "None"
          jq -n --arg token "$NSTBROWSER_API_KEY" --arg profile "$NSTBROWSER_TEST_PROFILE_ID" \
            --arg proxy_url "http://bb130b89f9e94ea21e87__cr.ca:6a3b35e9ed6543e3@gw.dataimpulse.com:823" \
            '{NSTBROWSER_API_KEY:$token,NSTBROWSER_TEST_PROFILE_ID:$profile,PROXY_URL:$proxy_url,CAPMONSTER_PROXY_URL:$proxy_url,BROWSER_VENDOR:"nstbrowser",MONGODB_URI:"mongodb://127.0.0.1:27017"}' >/tmp/canary-secret.json
          aws secretsmanager put-secret-value --secret-id "$secret_id" --secret-string file:///tmp/canary-secret.json >/dev/null
          rm -f /tmp/canary-secret.json
        env:
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          NSTBROWSER_TEST_PROFILE_ID: ${{ secrets.NSTBROWSER_TEST_PROFILE_ID }}
          NSTBROWSER_API_KEY: ${{ secrets.NSTBROWSER_API_KEY }}
      - name: Verify EBS, test MongoDB record, headed test profile, and local noVNC
        run: |
          set -euo pipefail
          vm_id="$(aws ec2 describe-instances --filters "Name=tag:ResourcePrefix,Values=$RESOURCE_PREFIX" "Name=tag:Ephemeral,Values=true" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          test -n "$vm_id" && test "$vm_id" != "None"
          .github/scripts/ssm-run.sh "$vm_id" "sudo systemctl restart jobbots-load-secrets.service jobbots-nstbrowser.service jobbots-novnc.service; source /etc/jobbots/secrets.env; for attempt in \$(seq 1 30); do curl -sS http://127.0.0.1:8848/ >/dev/null && break; sleep 2; done; curl -fsS -X PUT -H \"x-api-key: \\$NSTBROWSER_API_KEY\" -H 'content-type: application/json' -d \"{\\\"url\\\":\\\"\\$PROXY_URL\\\"}\" \"http://127.0.0.1:8848/api/v2/profiles/\\$NSTBROWSER_TEST_PROFILE_ID/proxy\" >/dev/null || true; docker exec jobbots-mongodb mongosh --quiet --eval 'db.getSiblingDB(\"jobbots_canary\").records.updateOne({canary_id:\"${CANARY_ID}\"},{\\$set:{phase:\"${PHASE}\",updated_at:new Date()}},{upsert:true}); db.getSiblingDB(\"jobbots_canary\").records.countDocuments({canary_id:\"${CANARY_ID}\"})' | grep -q 1; curl -fsS -X POST -H \"x-api-key: \\$NSTBROWSER_API_KEY\" -H 'content-type: application/json' -d '{\"headless\":false,\"autoClose\":false}' \"http://127.0.0.1:8848/api/v2/browsers/\\$NSTBROWSER_TEST_PROFILE_ID\" >/tmp/nst-start.json; ss -lnt | grep -q '127.0.0.1:6080'; ! systemctl is-active --quiet jobbots-supervisor.service; curl -fsS -X DELETE -H \"x-api-key: \\$NSTBROWSER_API_KEY\" \"http://127.0.0.1:8848/api/v2/browsers/\\$NSTBROWSER_TEST_PROFILE_ID\" >/dev/null || true"
        env:
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          CANARY_ID: ${{ vars.CANARY_RECORD_ID }}
          PHASE: ${{ inputs.phase }}
