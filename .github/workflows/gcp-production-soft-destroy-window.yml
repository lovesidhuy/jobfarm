name: GCP Production Soft-Destroy Window

on:
  workflow_dispatch:
    inputs:
      delay_minutes:
        description: Minutes to keep the production farm running before soft-destroy
        required: true
        type: number
        default: 360

permissions:
  actions: write
  contents: read

concurrency:
  group: gcp-production-soft-destroy-window
  cancel-in-progress: true

jobs:
  delayed-soft-destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Hold production window
        env:
          DELAY_MINUTES: ${{ inputs.delay_minutes }}
        run: |
          set -euo pipefail
          case "$DELAY_MINUTES" in
            ''|*[!0-9]*) echo "delay_minutes must be an integer" >&2; exit 2 ;;
          esac
          [ "$DELAY_MINUTES" -ge 1 ] || { echo "delay_minutes must be positive" >&2; exit 2; }
          sleep "$((DELAY_MINUTES * 60))"

      - name: Soft-destroy GCP compute after window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run gcp-production-cycle.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f action=soft-destroy
