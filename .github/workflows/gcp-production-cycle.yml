name: GCP Production Compute Cycle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: GCP compute action
        required: true
        type: choice
        default: run
        options: [run, sync, awake, sleep, soft-destroy, destroy, full-destroy, status, health, preflight, verify-logins, recover]
      confirm_destroy:
        description: Exact GCP resource prefix required for compute destroy
        required: false
        type: string
      confirm_full_destroy:
        description: Exact GCP resource prefix required for full destroy (includes AWS backend/artifacts)
        required: false
        type: string
      confirm_login_check:
        description: Exact GCP resource prefix required to spend NST quota verifying portal logins
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-compute-production
  cancel-in-progress: false

jobs:
  lifecycle:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load shared deployment values from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG || vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV || 'dev' }}
          secret-path: /
          export-type: env

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install Infisical CLI for backend bootstrap
        run: |
          set -euo pipefail
          if ! command -v infisical >/dev/null 2>&1; then
            curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
            sudo apt-get update
            sudo apt-get install -y infisical
          fi
          infisical --version

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Run GCP compute lifecycle
        env:
          # Pushes sync an already-running worker; manual run remains the
          # explicit power-on/provision path and preserves the light switch.
          ACTION: ${{ inputs.action || 'sync' }}
          CLOUD_PROVIDER: gcp
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_RESOURCE_PREFIX: ${{ vars.GCP_RESOURCE_PREFIX }}
          GCP_ARTIFACT_BUCKET_NAME: ${{ vars.GCP_ARTIFACT_BUCKET_NAME }}
          GCP_GOLDEN_IMAGE_FAMILY: ${{ vars.GCP_GOLDEN_IMAGE_FAMILY }}
          GCP_GOLDEN_IMAGE_PROJECT: ${{ vars.GCP_GOLDEN_IMAGE_PROJECT }}
          TARGET_ENVIRONMENT: production
          DEPLOYMENT_TIER: production
          GCP_TARGET_ENVIRONMENT: production
          GITHUB_TOKEN: ${{ github.token }}
          GCP_CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
          GCP_CONFIRM_FULL_DESTROY: ${{ inputs.confirm_full_destroy }}
          NST_LOGIN_CHECK_CONFIRM: ${{ inputs.confirm_login_check }}
          TF_VM_ADMIN_PASSWORD: ${{ secrets.TF_VM_ADMIN_PASSWORD }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            run) bash scripts/gcp_lifecycle.sh run ;;
            sync)
              state="$(gcloud compute instances describe "$GCP_VM_NAME" \
                --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" \
                --format='value(status)' 2>/dev/null || true)"
              if [ "$state" != "RUNNING" ]; then
                echo "GCP worker is OFF or not provisioned; leaving it unchanged."
                echo "Use the ON switch when you want the next push to apply immediately."
                exit 0
              fi
              bash scripts/gcp_lifecycle.sh sync
              ;;
            awake|sleep|soft-destroy|destroy|full-destroy|status|health|preflight|verify-logins|recover)
              bash scripts/gcp_lifecycle.sh "$ACTION"
              ;;
            *) echo "Unsupported GCP action: $ACTION" >&2; exit 2 ;;
          esac
