name: Canary Fail-Closed Destruction Tests

on:
  workflow_dispatch:
    inputs:
      failure_point:
        description: Safe canary failure to inject
        required: true
        type: choice
        options: [mongodb_shutdown, mongodump, s3_upload, checksum, artifact_upload, ebs_detachment, resource_ownership]
      confirm_resource_prefix:
        description: Type the exact protected RESOURCE_PREFIX to run failure tests
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: linux-lifecycle-canary
  cancel-in-progress: false

jobs:
  prove-blocked:
    environment: canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Assert canary target
        run: |
          bash .github/scripts/assert-linux-target.sh
          test "$CONFIRM_RESOURCE_PREFIX" = "$RESOURCE_PREFIX"
        env:
          TARGET_ENVIRONMENT: canary
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          VM_NAME: ${{ vars.VM_NAME }}
          ARTIFACT_PREFIX: ${{ vars.ARTIFACT_PREFIX }}
          CONFIRM_RESOURCE_PREFIX: ${{ inputs.confirm_resource_prefix }}
      - name: Prove shutdown gate fails before destruction
        run: |
          set -euo pipefail
          vm_id="$(aws ec2 describe-instances --filters "Name=tag:ResourcePrefix,Values=$RESOURCE_PREFIX" "Name=tag:Ephemeral,Values=true" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          volume_id="$(aws ec2 describe-volumes --filters "Name=tag:ResourcePrefix,Values=$RESOURCE_PREFIX" "Name=tag:Persistent,Values=true" --query 'Volumes[0].VolumeId' --output text)"
          test -n "$vm_id" && test "$vm_id" != "None"
          test -n "$volume_id" && test "$volume_id" != "None"
          case "$FAILURE_POINT" in
            ebs_detachment|resource_ownership) false_command="exit 86" ;;
            *) false_command="sudo env JOBBOTS_FAILURE_INJECTION=$FAILURE_POINT /opt/jobbots/bin/jobbots-prepare-destroy" ;;
          esac
          if .github/scripts/ssm-run.sh "$vm_id" "$false_command"; then
            echo "Failure injection unexpectedly succeeded." >&2
            exit 1
          fi
          test "$(aws ec2 describe-instances --instance-ids "$vm_id" --query 'Reservations[0].Instances[0].State.Name' --output text)" = "running"
          test "$(aws ec2 describe-volumes --volume-ids "$volume_id" --query 'Volumes[0].State' --output text)" = "in-use"
        env:
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          FAILURE_POINT: ${{ inputs.failure_point }}
