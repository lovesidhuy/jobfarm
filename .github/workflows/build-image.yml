name: Build Linux Golden Image

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected GitHub environment
        required: true
        type: choice
        options: [canary, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: linux-lifecycle-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  build:
    environment: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      - run: packer init packer/jobbots-golden.pkr.hcl
      - name: Validate environment-scoped image
        run: |
          packer validate \
            -var "environment=$TARGET_ENVIRONMENT" \
            -var "deployment_tier=$TARGET_ENVIRONMENT" \
            -var "resource_prefix=$RESOURCE_PREFIX" \
            packer/jobbots-golden.pkr.hcl
        env:
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      - name: Build environment-scoped AMI
        run: |
          set -euo pipefail
          test -n "${RESOURCE_PREFIX:-}"
          packer build -color=false \
            -var "aws_region=$AWS_REGION" \
            -var "image_name=${RESOURCE_PREFIX}-linux-golden-${GITHUB_RUN_ID}" \
            -var "environment=$TARGET_ENVIRONMENT" \
            -var "deployment_tier=$TARGET_ENVIRONMENT" \
            -var "resource_prefix=$RESOURCE_PREFIX" \
            packer/jobbots-golden.pkr.hcl
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
