name: Canary Preflight Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: linux-lifecycle-canary
  cancel-in-progress: false

jobs:
  preflight:
    environment: canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Assert canary configuration
        run: bash .github/scripts/assert-linux-target.sh
        env:
          TARGET_ENVIRONMENT: canary
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          VM_NAME: ${{ vars.VM_NAME }}
          ARTIFACT_PREFIX: ${{ vars.ARTIFACT_PREFIX }}
      - name: Verify required protected values without printing them
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$TF_STATE_BUCKET"
          test -n "$NSTBROWSER_TEST_PROFILE_ID"
          test -n "$NSTBROWSER_API_KEY"
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          NSTBROWSER_TEST_PROFILE_ID: ${{ secrets.NSTBROWSER_TEST_PROFILE_ID }}
          NSTBROWSER_API_KEY: ${{ secrets.NSTBROWSER_API_KEY }}
      - name: Verify no production-tagged resources match the canary prefix
        run: |
          set -euo pipefail
          test "$(aws resourcegroupstaggingapi get-resources --tag-filters Key=ResourcePrefix,Values="$RESOURCE_PREFIX" Key=DeploymentTier,Values=production --query 'length(ResourceTagMappingList)' --output text)" = "0"
        env:
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
      - name: Create persistent-resource plan without applying
        run: |
          set -euo pipefail
          cat >terraform/persistent/environment.auto.tfvars <<EOF
          aws_region           = "$AWS_REGION"
          availability_zone    = "$AVAILABILITY_ZONE"
          environment          = "canary"
          deployment_tier      = "canary"
          resource_prefix      = "$RESOURCE_PREFIX"
          volume_size_gb       = $PERSISTENT_VOLUME_SIZE_GB
          artifact_retention_days = $ARTIFACT_RETENTION_DAYS
          EOF
          terraform -chdir=terraform/persistent init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=${RESOURCE_PREFIX}/persistent.tfstate"
          terraform -chdir=terraform/persistent plan -detailed-exitcode -out=tfplan || test "$?" = "2"
          terraform -chdir=terraform/persistent show -no-color tfplan >canary-persistent-plan.txt
          grep -q "$RESOURCE_PREFIX" canary-persistent-plan.txt
          ! grep -q "DeploymentTier.*production" canary-persistent-plan.txt
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AVAILABILITY_ZONE: ${{ vars.AVAILABILITY_ZONE }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
          PERSISTENT_VOLUME_SIZE_GB: ${{ vars.PERSISTENT_VOLUME_SIZE_GB }}
          ARTIFACT_RETENTION_DAYS: ${{ vars.ARTIFACT_RETENTION_DAYS }}
      - name: Upload non-secret preflight plan
        uses: actions/upload-artifact@v4
        with:
          name: canary-persistent-plan-${{ github.run_id }}
          path: canary-persistent-plan.txt
          retention-days: 7
