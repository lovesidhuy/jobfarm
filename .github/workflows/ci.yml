# Light lint/import smoke only.
# Full unit suite + bot canaries + production deploy run on **Travis CI**
# (.travis.yml). Do not add deploy jobs here — use Travis.
name: CI — Lint & Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'automation_monorepo/**'
      - 'jobbots/**'
      - 'profiles/**'
      - 'pyproject.toml'
      - 'retired/linkedin-ai-auto-apply-source/**'
      - 'resume_workflow/**'
      - 'master/Auto_job_applier_linkedIn_gen/**'
      - 'master/Auto_job_applier_linkedIn_it/**'
      - 'ansible/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'terraform/*.tf'
      - 'terraform/**/*.tf'
      - 'packer/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.travis.yml'
      - '.github/workflows/*.yml'
      - '.github/scripts/**'
      - 'scripts/smoke_go_live.sh'
      - 'docker-compose.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-smoke:
    name: Lint + import smoke
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install ruff pytest pytest-cov

      - name: Ruff lint (syntax + undefined names)
        run: |
          ruff check \
            automation_monorepo/core \
            automation_monorepo/bots \
            jobbots \
            --select E9,F821 \
            --exclude automation_monorepo/core/llm_backend/ai \
            --exclude automation_monorepo/core/portals \
            --exclude automation_monorepo/core/validator.py \
            --exclude jobbots/core/llm_backend/ai \
            --exclude jobbots/core/portals \
            --exclude jobbots/core/validator.py \
            --output-format=github

      - name: Compile Python modules
        run: |
          python -m compileall -q \
            jobbots \
            automation_monorepo/core \
            automation_monorepo/bots \
            automation_monorepo/config
          python -m compileall -q \
            master/Auto_job_applier_linkedIn_gen/core \
            master/Auto_job_applier_linkedIn_gen/config \
            master/Auto_job_applier_linkedIn_gen/runAiBot.py \
            master/Auto_job_applier_linkedIn_it/core \
            master/Auto_job_applier_linkedIn_it/config \
            master/Auto_job_applier_linkedIn_it/runAiBot.py

      - name: Smoke — LinkedIn hybrid runner syntax
        run: |
          node --check retired/linkedin-ai-auto-apply-source/hybrid_runner.js
          node --check retired/linkedin-ai-auto-apply-source/hybrid_heuristics.js

      - name: Unit — form-fill and ATS safeguards (offline AI disabled)
        run: |
          FORM_ANSWERS_DISABLE_AI=1 PYTHONPATH=.:automation_monorepo \
            pytest \
              automation_monorepo/tests/test_form_answers_smart_fill.py \
              automation_monorepo/tests/test_ats_adapters.py \
              automation_monorepo/tests/test_ats_flywheel.py \
              automation_monorepo/tests/test_cf_heavy_proxy.py \
              automation_monorepo/tests/test_farm_topology.py \
              automation_monorepo/tests/test_jobspy_google.py \
              automation_monorepo/tests/test_ats_brain_fill.py \
              -q --tb=line

      - name: Offline farm productivity contract
        env:
          CI: "1"
          # doctor --quick must not require Infisical secrets on public GH runners
          MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          PYTHONPATH=.:automation_monorepo python -m jobbots.app.cli farm-check
          PYTHONPATH=.:automation_monorepo python -m jobbots.app.cli doctor --quick
          PYTHONPATH=.:automation_monorepo python -m jobbots.app.cli qa check

      - name: Unit — discovery gates and queue batching
        run: |
          # Indeed gate import pulls browser/pyautogui paths that read DISPLAY.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          MONGODB_URI=mongodb://127.0.0.1:27017 FORM_ANSWERS_DISABLE_AI=1 PYTHONPATH=automation_monorepo \
            xvfb-run -a pytest automation_monorepo/tests/test_discovery.py automation_monorepo/tests/test_job_queue.py -q --tb=line

      - name: Unit — Langfuse tracing is optional and redacted
        run: |
          LANGFUSE_TRACING_ENABLED=0 PYTHONPATH=automation_monorepo \
            pytest automation_monorepo/tests/test_langfuse_tracing.py -q --tb=line

      # Pin factory hotpatches so SYNC/RUN deploys do not regress live fixes.
      - name: Smoke — prod hotpatches still in deploy path
        run: |
          bash scripts/ci_prod_hotpatch_check.sh

      - name: Smoke — import core modules
        env:
          BOT_NAME: ci-smoke
          INFISICAL_CLIENT_ID: ""
          INFISICAL_CLIENT_SECRET: ""
          INFISICAL_PROJECT_SLUG: ""
        run: |
          cd automation_monorepo
          python -c "
          import sys, os
          os.environ.setdefault('BOT_NAME', 'ci-smoke')
          os.environ.setdefault('INFISICAL_CLIENT_SECRET', '')
          from core.secret_manager import get_secret
          from core.utils import print_lg
          from core.supervisor_runtime import merge_dotenv_into_env
          from core.supervised_bots import supervised_bot_configs
          cfgs = supervised_bot_configs()
          print(f'  core imports OK  — {len(cfgs)} bot configs loaded')
          "

      - name: Smoke — config/settings parse
        env:
          BOT_NAME: ci-smoke
          INFISICAL_CLIENT_ID: ""
          INFISICAL_CLIENT_SECRET: ""
          INFISICAL_PROJECT_SLUG: ""
        run: |
          cd automation_monorepo
          python -c "
          import os
          os.environ.setdefault('BOT_NAME', 'ci-smoke')
          os.environ.setdefault('INFISICAL_CLIENT_SECRET', '')
          import config.settings as s
          print(f'  settings OK  — stealth_mode={s.stealth_mode}  cdp_port={s.cdp_port}')
          "

      - name: Smoke — proxy env present
        env:
          BOT_NAME: ci-smoke
          PROXY_URL: "http://user:pass@1.2.3.4:1234"
        run: |
          python -c "
          import os
          url = os.environ.get('PROXY_URL','')
          assert url.startswith('http'), f'PROXY_URL missing or malformed: {url!r}'
          print(f'  PROXY_URL smoke OK: {url}')
          "

      - name: Smoke — monorepo supervisor + bot configs
        env:
          BOT_NAME: ci-smoke
          INFISICAL_CLIENT_ID: ""
          INFISICAL_CLIENT_SECRET: ""
          INFISICAL_PROJECT_SLUG: ""
        run: |
          # Portal imports pull pyautogui → mouseinfo, which needs a display.
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          cd automation_monorepo
          xvfb-run -a python _smoke_supervisor.py

      - name: Smoke — ixBrowser library imports
        env:
          BOT_NAME: ci-smoke
          INFISICAL_CLIENT_ID: ""
          INFISICAL_CLIENT_SECRET: ""
          INFISICAL_PROJECT_SLUG: ""
        run: |
          cd automation_monorepo
          python -c "
          # Verify ixBrowser library imports correctly
          from ixbrowser_local_api import IXBrowserClient, Profile, Proxy, Preference, Fingerprint, Consts
          print('  ixBrowser API library OK')
          # Verify auto_mode helpers
          from core.auto_mode import auto_alert, auto_confirm, is_autonomous, set_window_title_marker
          print('  core.auto_mode OK')
          "

      - name: Smoke — bot launchers compile
        env:
          BOT_NAME: ci-smoke
          INFISICAL_CLIENT_ID: ""
          INFISICAL_CLIENT_SECRET: ""
          INFISICAL_PROJECT_SLUG: ""
          AUTONOMOUS_SUPERVISOR: "1"
        run: |
          cd automation_monorepo
          python -c "
          import bots.indeed_it
          import bots.indeed_general  
          import bots.glassdoor_it
          import bots.glassdoor_general
          import bots.workopolis_it
          import bots.workopolis_general
          import bots.linkedin_it
          import bots.linkedin_general
          import bots.google_it
          print('  All bot launchers OK (indeed/glassdoor/workopolis/linkedin/google_it)')
          "


      - name: Install Playwright & Chromium system dependencies
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Smoke — Headless Browser Launch (Xvfb & Playwright)
        env:
          BOT_NAME: ci-smoke
          INFISICAL_CLIENT_ID: ""
          INFISICAL_CLIENT_SECRET: ""
          INFISICAL_PROJECT_SLUG: ""
          BYPASS_PROXY: "1"
          BROWSER_VENDOR: "chrome"
        run: |
          cd automation_monorepo
          xvfb-run --server-args="-screen 0 1920x1080x24" python _smoke_browser.py

      - name: Wait for MongoDB service
        run: |
          for i in $(seq 1 30); do
            python -c "import socket; s=socket.create_connection(('127.0.0.1',27017),2); s.close()" && echo mongo_ok && exit 0
            sleep 1
          done
          echo "MongoDB service not ready" >&2
          exit 1

      - name: Unit tests + coverage (Codecov)
        env:
          BOT_NAME: ci-smoke
          INFISICAL_CLIENT_ID: ""
          INFISICAL_CLIENT_SECRET: ""
          INFISICAL_PROJECT_SLUG: ""
          DD_METRICS_ENABLED: "0"
          DISCOVERY_REFRESH_EMAIL_HISTORY: "0"
          NSTBROWSER_FORBID_CREATE: "1"
          NSTBROWSER_ACTIVE_SLOT: "1"
          MONGODB_URI: "mongodb://127.0.0.1:27017"
          PYTHONPATH: .
        working-directory: automation_monorepo
        run: |
          xvfb-run -a python -m pytest tests/ -q --cov=core --cov-report=xml:coverage.xml --tb=line

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: automation_monorepo/coverage.xml
          flags: unittests
          name: job-automation-bots
          fail_ci_if_error: false

  config-validation:
    name: Config validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          GROQ_API_KEY: ci-placeholder
          MONGODB_PASSWORD: ci-placeholder
        run: docker compose config --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate without backend
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform/persistent init -backend=false
          terraform -chdir=terraform/persistent validate

      - name: Validate Packer Linux image
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer validate
        run: |
          packer init packer/jobbots-golden.pkr.hcl
          packer validate \
            -var environment=canary \
            -var deployment_tier=canary \
            -var resource_prefix=jobbots-canary-static-ci \
            packer/jobbots-golden.pkr.hcl

      - name: Validate shell and active workflow syntax
        run: |
          for script in .github/scripts/*.sh packer/scripts/provision_linux.sh packer/linux/bin/*; do
            bash -n "$script"
          done
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f) }'

  monorepo-windows-smoke:
    name: Monorepo — Windows smoke
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke — supervisor + master LinkedIn trees
        working-directory: automation_monorepo
        env:
          BOT_NAME: ci-smoke
          INFISICAL_CLIENT_ID: ""
          INFISICAL_CLIENT_SECRET: ""
          INFISICAL_PROJECT_SLUG: ""
        run: |
          python _smoke_supervisor.py

      - name: Smoke — ixBrowser VM setup script (PowerShell syntax)
        run: |
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw scripts\setup_ixbrowser_vm.ps1), [ref]$null
          )
          Write-Output "  Windows: setup_ixbrowser_vm.ps1 syntax OK"
