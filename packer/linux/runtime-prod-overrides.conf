# Production overrides loaded by systemd EnvironmentFile=-/etc/jobbots/runtime-prod-overrides.conf
# Installed by bootstrap_stock_worker / provision on every SYNC/RUN.
# Secrets (PROXY_URL, WEBSHARE_*, CAPMONSTER_*) come from Secrets Manager / Infisical
# via /etc/jobbots/secrets.env — do not put credentials in this file.

# Production NST slot (verified logged-in profile set on the active account).
# Slot 1: NSTBROWSER_API_KEY + NSTBROWSER_PROFILE_ID_{BOT}
# Slot 2: NSTBROWSER_API_KEY_2 + NSTBROWSER_PROFILE_ID_2_{BOT}
# 2026-08-09: pin slot 2 (slot 1 near daily open cap; Job Bank Direct Apply
# profile provisioned on slot 2 as Nst_jobbank_it).
NSTBROWSER_ACTIVE_SLOT=2
NSTBROWSER_QUOTA_SOFT_LIMIT=28
KEEP_BROWSER=1
NSTBROWSER_KEEP_ALIVE=1
NSTBROWSER_FORBID_CREATE=1
# Proxy lanes (2026-08-07):
#   * Indeed / Glassdoor / Workopolis → Proxy-Cheap for browser + CapMonster
#     (same egress; CF/captcha heavy). Stamped per job in application_worker.
#   * LinkedIn / Job Bank → Webshare static (no CF thrash like Indeed).
#   * ATS (GH/Lever/…) → no residential proxy (Playwright direct).
# Discovery JobSpy ladder still uses Webshare + Cheap rotation separately.
NSTBROWSER_ROTATE_PROXY=0
# One-time profile proxy migration uses NSTBROWSER_SYNC_PROFILE_PROXY=1;
# worker attaches do not mutate profile proxies; provision them explicitly.
# LinkedIn production = ONE NST session (linkedin_general) for IT + office/CS.
# Indeed IT / Glassdoor IT / Workopolis IT keep separate portal profiles.

# Prefer Akash ML DeepSeek (free) for apply/screen; OpenRouter is paid failover
# when Akash times out / 429 / 5xx. deepseek_completion walks the chain.
LLM_PROVIDER=akashml
LLM_FALLBACK_OPENROUTER=1

# Langfuse observability for shared LLM screening/form-answer calls. Keys are
# injected from Infisical into /etc/jobbots/secrets.env at bootstrap time.
LANGFUSE_TRACING_ENABLED=1
LANGFUSE_BASE_URL=https://us.cloud.langfuse.com
LANGFUSE_TRACING_ENVIRONMENT=production
LLM_PROVIDER_RETRIES=1
OPENROUTER_MODEL=deepseek/deepseek-chat
DISCOVERY_ENGINE=new

# Workopolis HTTP is 403-blocked from cloud residential proxies → NST browser
# scrape. 2026-07-25: unlimited browser burned NST for 0 enqueue. Re-enabled
# with fail-fast HTTP (WORKOPOLIS_HTTP_MAX_HARD_BLOCKS) + capped browser cells
# (WORKOPOLIS_BROWSER_MAX_QUERIES) so one profile open scrapes a bounded set.
WORKOPOLIS_ALLOW_BROWSER_FALLBACK=1
# HTTP is 403 from cloud proxies — fail fast and spend budget on browser scrape.
WORKOPOLIS_HTTP_MAX_HARD_BLOCKS=1
WORKOPOLIS_BROWSER_MAX_QUERIES=48

# Discovery proxies on AWS: Webshare (static) + Proxy-Cheap (rotating).
# No DataImpulse. Skip bare EC2 egress (job boards block AWS IPs).
# scrape_proxy blacklists any tier that returns HTTP 407 for the process lifetime.
# WEBSHARE_PROXY_URL / JOBSPY_PROXY_WEBSHARE / PROXY_URL live in secrets.env
# (host must be working — dead Webshare :7321 is auto-healed in bootstrap).
JOBSPY_SKIP_LOCAL=1
JOBSPY_PROXY_MODE=smart

# Phase I cost model (EA-first)
# 2026-07-26: 3d window mined out after yesterday's apply wave (0 enqueues on
# live tick: 1517 raw → 24 already-known + hard-gate rejects only). Use 7d so
# junior/mid IT Easy Apply that still has an open form can re-enter the funnel.
# LinkedIn apply remains paused until NST re-login; discovery still indexes.
JOBBOTS_DISCOVERY_FRESHNESS_DAYS=7
JOBSPY_FULL_DESCRIPTION=0
# SERP cache off while hunting volume after mined days (identical raw ticks).
# Re-enable DISCOVERY_SERP_CACHE=1 later if proxy quota is the bottleneck.
DISCOVERY_SERP_CACHE=0
DISCOVERY_SERP_CACHE_HOURS=4
# Term memory disabled: it was suppressing portal×term×location cells after
# only 2 zero-new ticks for 12h, which reduced search coverage and application
# throughput. Goal is numbers; re-enable later if proxy quota becomes the bottleneck.
DISCOVERY_TERM_MEMORY=0
DISCOVERY_TERM_SKIP_AFTER=2
DISCOVERY_TERM_SKIP_HOURS=12
DISCOVERY_EMAIL_REFRESH_HOURS=6
# Batch AI: keep total deferred titles moderate; gates.py chunks into
# DISCOVERY_BATCH_AI_CHUNK (default 12) so Akash DeepSeek does not timeout
# the whole set (fail-closed was zeroing Indeed enqueues on 2026-08-01).
DISCOVERY_BATCH_AI_MAX=36
# Smaller chunks = fewer Akash timeouts; OpenRouter failover covers the rest.
DISCOVERY_BATCH_AI_CHUNK=4
DEEPSEEK_TIMEOUT_SECONDS=120
# Screen+enqueue after each term batch so LinkedIn feeds the apply queue
# during the long JobSpy crawl (63 terms × 11 cities). Full-parallel waits
# for all ~700 queries before any enqueue → multi-hour starve. Small batches
# publish qualified leads early while the remainder continues scanning.
LINKEDIN_DISCOVERY_SEQUENTIAL=1
LINKEDIN_DISCOVERY_TERM_BATCH=3

# Google ATS: sticky browser+CapMonster IP on rotating residential proxies.
GOOGLE_CDP_STICKY_SESSION=jobbots-google-ats
# Firecrawl ATS web-search fallback. Credentials are loaded separately from
# Secrets Manager; this flag enables the provider when credits are available.
FIRECRAWL_ATS_ENABLED=1
FIRECRAWL_SCRAPE_ENABLED=0
GOOGLE_CDP_FIRECRAWL_FALLBACK=0
# Tavily ATS web-search fallback; credentials come from Secrets Manager.
TAVILY_ATS_ENABLED=1
GOOGLE_CDP_TAVILY_FALLBACK=0

# API discovery supplements: only direct, supported ATS URLs are emitted, so
# they feed the Playwright ATS worker without consuming NST quota. Both
# providers have two accounts in the runtime secret; bounded queries protect
# the free/trial quotas while adding useful coverage each discovery cycle.
JOBSPIPE_ENABLED=1
JOBSPIPE_COUNTRY_CODE=CA
# Higher caps for ATS refill — dual API keys; only direct GH/Lever/Ashby/Bamboo URLs enqueue.
JOBSPIPE_MAX_QUERIES_PER_RUN=12
JOBSPIPE_MAX_RESULTS_PER_QUERY=15
JOBSPIPE_REQUEST_PAUSE_SECONDS=0.4
JOBSPIPE_TIMEOUT_SECONDS=45
ADZUNA_ENABLED=1
ADZUNA_MAX_QUERIES_PER_RUN=10
ADZUNA_RESULTS_PER_QUERY=15
ADZUNA_REQUEST_PAUSE_SECONDS=0.4
FIRECRAWL_ATS_MAX_RESULTS=12
TAVILY_ATS_MAX_RESULTS=15
ATS_CROSSMATCH_MAX_PER_TERM=50

# Glassdoor hybrid: CDP (residential tunnel + CF escalate to Proxy-Cheap) plus
# JobSpy HTTP with normalize_glassdoor_location map. CDP alone was empty under
# Cloudflare; JobSpy alone 400s some Metro Van strings — together they produce leads.
GLASSDOOR_DISCOVERY_PROVIDER=hybrid
GLASSDOOR_CDP_CHUNK=0

# Apply queue: ALL production portals (quota restored 2026-08-06 evening).
# Workers portal-sharded (supervisor): indeed | linkedin | glassdoor | workopolis |
# google/greenhouse/lever (+ ashby/bamboohr). Browser portals use dedicated NST
# profiles + static Webshare. ATS (GH/Lever/Ashby/Bamboo) is Playwright — no NST.
# LinkedIn: ONE NST session for IT+office/CS (linkedin-only shard claims both
# profiles). Glassdoor/Workopolis general stay off (IT only).
# Job Bank is authenticated Direct Apply only. It uses the dedicated
# jobbank_it NST profile, configured once with the static Webshare proxy and
# mapped through NSTBROWSER_PROFILE_ID_JOBBANK_IT in secrets.env.
# Soft limit 28 + FORBID_CREATE + KEEP_ALIVE keep daily opens under ~25-30.
# ATS Playwright: headless in prod (set 0 only for RDP/noVNC inspection).
ATS_HEADLESS=1
# Bamboo/Lever reCAPTCHA v2 via CapMonster Cloud API (key from secrets.env).
# Browser stays direct; CapMonster task may use CAPMONSTER_PROXY_URL when set.
USE_CAPMONSTER_CAPTCHA_SOLVER=1
CAPTCHA_USE_CAPMONSTER=1
USE_CAPMONSTER=1
CAPMONSTER_RECAPTCHA_PROXYLESS_FALLBACK=1
ATS_CAPTCHA_ALLOW_HUMAN_WAIT=0
# Full browser + ATS apply set. Job Bank email application is retired.
JOBBOTS_APPLY_PORTALS=indeed,linkedin,glassdoor,workopolis,jobbank,google,greenhouse,lever,ashby,bamboohr
# Indeed general (office/CS) on the general worker; LinkedIn office/CS drains
# via the main LinkedIn sole-session shard (claims profile=it|general).
JOBBOTS_GENERAL_APPLY_PORTALS=indeed
# 5 parallel NST opens thrash the host. Keep 4 portal shards; LinkedIn+Indeed
# stay separate. ATS worker is Playwright-only (no NST).
JOBBOTS_APPLICATION_WORKERS=4
# NST open retries under concurrent portal pressure (open_chrome).
NSTBROWSER_LAUNCH_RETRIES=3
# Secondary portals use dedicated NST profiles — run in parallel for throughput.
# Set to 1 only when NST opens are near soft limit and primary still has depth.
JOBBOTS_DEFER_GLASSDOOR_WORKOPOLIS=0
# Job Bank Direct Apply is first-party and confirmation-backed; no SMTP lane.
JOBBOTS_JOBBANK_EMAIL_APPLY_RETIRED=1
JOBBANK_DIRECT_APPLY_ENABLED=1
JOBBANK_NST_PROFILE_NAME=Nst_jobbank_it
JOBBANK_NST_PROXY_MODE=webshare
JOBBANK_SHARE_EMAIL=1
JOBBANK_RESUME_NAME=ls_resume.pdf
JOBBANK_COVER_LETTER_NAME=lscoop_coverletter.pdf
# Discovery SERP geography — Metro Van first so Direct Apply rows survive
# location policy instead of Canada-wide scan → 0 enqueue.
JOBBOTS_JOBBANK_LOCATION=Vancouver, BC
JOBBOTS_JOBBANK_MAX_RESULTS=35
JOBBOTS_GENERAL_APPLICATION_WORKERS=1
# Rediscovery reopens recoverable dead rows after cooldown (see job_queue.py).
# Lower cooldown keeps LinkedIn/Greenhouse/Indeed workers from idling when
# form stalls / submit-confirm misses dominate terminal states.
JOBBOTS_REENQUEUE_COOLDOWN_SECONDS=7200
# Discovery volume knobs (Metro Van Easy Apply)
# Per-portal result depth (Indeed IT uses all hero terms every tick — confirmed).
JOBBOTS_DISCOVERY_MAX_RESULTS=35
JOBBOTS_INDEED_MAX_RESULTS=35
JOBBOTS_GLASSDOOR_MAX_RESULTS=40
JOBBOTS_LINKEDIN_MAX_RESULTS=60
JOBBOTS_LINKEDIN_GENERAL_MAX_RESULTS=50
JOBBOTS_GENERAL_DISCOVERY_MAX_RESULTS=20
JOBBOTS_INDEED_GENERAL_TERM_BATCH=3
# JobSpy LinkedIn detail pass: retain external Greenhouse/Lever applyUrl when
# LinkedIn exposes it. Discovery-only; never submits an application.
LINKEDIN_EXTERNAL_ATS_DISCOVERY=1

# Glassdoor CDP: longer settle + pause to avoid early-success then empty SERPs.
GLASSDOOR_REQUEST_PAUSE_SECONDS=3.5
GLASSDOOR_CDP_SETTLE_SECONDS=4.5
# ATS (GH/Lever via Google): higher max per term; focused keyword override in bin.
JOBBOTS_ATS_MAX_RESULTS=40
# Hard geographic boundary for every discovery source and queued application:
# only confirmed Metro Vancouver municipalities are eligible. Canada-wide
# remote, other BC cities, and unclassified locations are rejected.
METRO_VANCOUVER_ONLY=1
ATS_BOARD_API_ENABLED=1
ATS_BOARD_API_MAX_SLUGS_PER_PLATFORM=250
ATS_CROSSMATCH_ENABLED=1
# Google JobSpy/CDP on ATS ticks returned 0 jobs + 429s for ~15min and starved
# refill. Hybrid ATS = board_api + crossmatch + Firecrawl + Tavily + JobsPipe +
# Adzuna (no Google unless explicitly re-enabled for a deep night).
JOBBOTS_ATS_INCLUDE_GOOGLE=0
JOBSPY_GOOGLE_ENABLED=0

# Keep runtime logs off the root-owned application checkout.
JOBBOTS_DATA_DIR=/var/lib/jobbots

# Paths (Linux worker — never Mac home paths)
GOOGLE_SERVICE_ACCOUNT_FILE=/etc/jobbots/google_service_account.json
RESUME_WORKFLOW_URL=http://127.0.0.1:3001
MONGODB_URI=mongodb://127.0.0.1:27017
JOBBOTS_MONGO_DATABASE=jobbots
