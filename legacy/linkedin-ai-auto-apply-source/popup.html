<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LinkedIn Automation Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #18191a;
      color: #e4e6eb;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #3a3b3c;
      padding-bottom: 8px;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      color: #ffffff;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 4px;
      background: #242526;
      color: #2ecc71;
      border: 1px solid #2ecc71;
    }
    .desc {
      font-size: 12px;
      color: #b0b3b8;
      line-height: 1.4;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>LinkedIn Automation Assistant</h2>
  </div>
  <div>
    <span class="status-badge">Ready / Active</span>
    <p class="desc">Managed by the local Jobfarm supervisor orchestration engine.</p>
  </div>
</body>
</html>
