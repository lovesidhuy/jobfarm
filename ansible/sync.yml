---
- name: Sync code + secrets to automation VM
  hosts: windows
  gather_facts: false

  vars:
    install_dir: 'C:\automation'
    monorepo_dir: 'C:\automation\automation_monorepo'

  tasks:

    - name: Pull latest code from GitHub (and detect what changed)
      # Capture the pre-pull SHA so we can diff against it after the reset
      # and conditionally skip expensive steps (pip, playwright). The marker
      # lines `OLD_SHA=` / `CHANGED_FILES=` are parsed by Ansible below.
      ansible.windows.win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        $url = "https://x-access-token:{{ lookup('env','GH_TOKEN') }}@github.com/jobfarm/jobfarm.git"
        cd "{{ install_dir }}"
        $oldSha = (git rev-parse HEAD 2>$null) ; if (-not $oldSha) { $oldSha = "" }
        git remote set-url origin $url
        git fetch origin main 2>&1 | %{ $_.ToString() }
        git reset --hard origin/main 2>&1 | %{ $_.ToString() }
        $newSha = git rev-parse HEAD
        Write-Output "OLD_SHA=$oldSha"
        Write-Output "NEW_SHA=$newSha"
        if ($oldSha -and ($oldSha -ne $newSha)) {
          $changed = git diff --name-only $oldSha $newSha
          Write-Output "CHANGED_FILES_BEGIN"
          $changed | ForEach-Object { Write-Output $_ }
          Write-Output "CHANGED_FILES_END"
        } else {
          Write-Output "CHANGED_FILES_BEGIN"
          Write-Output "CHANGED_FILES_END"
        }
        git log -1 --oneline
      register: git_result
      changed_when: true

    - name: Show git pull result
      ansible.builtin.debug:
        msg: "{{ git_result.stdout_lines }}"

    - name: Decide whether to reinstall Python deps
      # `python_deps_changed` is true when requirements.txt or any other
      # dependency-defining file moved in this push. False on a first-run
      # bootstrap (empty old SHA) too, so we don't double-install right after
      # the playbook already ran.
      ansible.builtin.set_fact:
        python_deps_changed: >-
          {{ (git_result.stdout is search('(?m)^requirements\.txt$'))
             or (git_result.stdout is search('(?m)^pyproject\.toml$')) }}

    - name: Note dependency-install decision
      ansible.builtin.debug:
        msg: "python_deps_changed={{ python_deps_changed }}"

    - name: Validate required runtime env vars from CI/Infisical
      ansible.builtin.assert:
        that:
          - lookup('env','INFISICAL_CLIENT_ID') | length > 0
          - lookup('env','INFISICAL_CLIENT_SECRET') | length > 0
          - lookup('env','PROXY_URL') | length > 0
          - lookup('env','CAPMONSTER_API_KEY') | length > 0
        fail_msg: "Missing required deployment secret(s). Check GitHub Infisical bootstrap secrets and Infisical dev project secrets."
        quiet: true

    - name: Write/update runtime .env with Infisical-fetched secrets
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        $envFile = "{{ monorepo_dir }}\.env"
        $required = [ordered]@{
          INFISICAL_CLIENT_ID     = $env:DEPLOY_INFISICAL_CLIENT_ID
          INFISICAL_CLIENT_SECRET = $env:DEPLOY_INFISICAL_CLIENT_SECRET
          INFISICAL_PROJECT_SLUG  = "mybots-r46g"
          INFISICAL_ENV           = "dev"
          PROXY_URL               = $env:DEPLOY_PROXY_URL
          CAPMONSTER_API_KEY      = $env:DEPLOY_CAPMONSTER_API_KEY
        }
        $missing = @()
        foreach ($item in $required.GetEnumerator()) {
          if ([string]::IsNullOrWhiteSpace([string]$item.Value)) { $missing += $item.Key }
          if (([string]$item.Value) -match "[`r`n]") { throw "Invalid newline in $($item.Key)" }
        }
        if ($missing.Count -gt 0) {
          throw "Missing required runtime .env values: $($missing -join ', ')"
        }

        $managedKeys = @($required.Keys)
        $kept = New-Object System.Collections.Generic.List[string]
        if (Test-Path $envFile) {
          foreach ($line in Get-Content -Path $envFile) {
            if ($line -match '^\s*([^#=\s]+)\s*=') {
              $key = $Matches[1]
              if ($managedKeys -contains $key) { continue }
            }
            $kept.Add($line)
          }
        }

        while ($kept.Count -gt 0 -and [string]::IsNullOrWhiteSpace($kept[$kept.Count - 1])) {
          $kept.RemoveAt($kept.Count - 1)
        }
        if ($kept.Count -gt 0) { $kept.Add("") }
        $kept.Add("# Managed by CI/CD deployment. Values are sourced from GitHub/Infisical.")
        foreach ($item in $required.GetEnumerator()) {
          $kept.Add("$($item.Key)=$($item.Value)")
        }
        $utf8NoBom = New-Object System.Text.UTF8Encoding -ArgumentList $false
        [System.IO.File]::WriteAllLines($envFile, [string[]]$kept, $utf8NoBom)
      environment:
        DEPLOY_INFISICAL_CLIENT_ID: "{{ lookup('env','INFISICAL_CLIENT_ID') }}"
        DEPLOY_INFISICAL_CLIENT_SECRET: "{{ lookup('env','INFISICAL_CLIENT_SECRET') }}"
        DEPLOY_PROXY_URL: "{{ lookup('env','PROXY_URL') }}"
        DEPLOY_CAPMONSTER_API_KEY: "{{ lookup('env','CAPMONSTER_API_KEY') }}"
      no_log: true

    - name: Validate runtime .env on VM (safe diagnostics)
      ansible.windows.win_shell: |
        $envFile = "{{ monorepo_dir }}\.env"
        $required = @(
          "INFISICAL_CLIENT_ID",
          "INFISICAL_CLIENT_SECRET",
          "INFISICAL_PROJECT_SLUG",
          "INFISICAL_ENV",
          "PROXY_URL",
          "CAPMONSTER_API_KEY"
        )
        if (-not (Test-Path $envFile)) { throw ".env missing at $envFile" }
        $content = Get-Content -Path $envFile
        $errors = @()
        foreach ($key in $required) {
          $found = @($content | Where-Object { $_ -match "^\s*$([regex]::Escape($key))\s*=\s*(.+)\s*$" })
          $empty = @($content | Where-Object { $_ -match "^\s*$([regex]::Escape($key))\s*=\s*$" })
          if ($found.Count -ne 1) { $errors += "${key} count=$($found.Count)" }
          if ($empty.Count -gt 0) { $errors += "${key} has empty duplicate" }
          Write-Output "${key}: present=$($found.Count -eq 1) duplicates=$([Math]::Max(0, $found.Count - 1))"
        }
        if ($errors.Count -gt 0) { throw "Invalid runtime .env: $($errors -join '; ')" }

    - name: Ensure runtime directories exist
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ monorepo_dir }}\\logs"
        - "{{ monorepo_dir }}\\data"
        - "{{ install_dir }}\\master\\Auto_job_applier_linkedIn_gen\\data"
        - "{{ install_dir }}\\master\\Auto_job_applier_linkedIn_gen\\logs"
        - "{{ install_dir }}\\master\\Auto_job_applier_linkedIn_it\\data"
        - "{{ install_dir }}\\master\\Auto_job_applier_linkedIn_it\\logs"
        - 'C:\automation\profiles'

    - name: Install any new Python requirements (only when deps changed)
      # Use `python -m pip` (bare `pip` may not be on PATH in WinRM session).
      # Skipped entirely on code-only pushes — saves ~45 s per sync.
      ansible.windows.win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        python -m pip install -r "{{ install_dir }}\requirements.txt" --no-cache-dir
      args:
        chdir: "{{ install_dir }}"
      async: 1200
      poll: 30
      when: python_deps_changed | bool

    - name: Ensure Playwright Chromium is installed (only when deps changed)
      # Idempotent and fast even when run, but the network round-trip still
      # costs ~3 s; skip it on pure code pushes.
      ansible.windows.win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        python -m playwright install chromium
      args:
        chdir: "{{ install_dir }}"
      async: 600
      poll: 30
      when: python_deps_changed | bool

    - name: Validate Infisical/runtime config on VM
      ansible.windows.win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        cd "{{ monorepo_dir }}"
        python test_infisical.py
      args:
        chdir: "{{ monorepo_dir }}"

    - name: Backfill CSV job history into MongoDB
      ansible.windows.win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        cd "{{ monorepo_dir }}"
        python scripts\import_csv_history_to_mongo.py
      args:
        chdir: "{{ monorepo_dir }}"
      changed_when: false
      failed_when: false

    - name: Refresh selected-bots shortcut on Desktop
      ansible.windows.win_copy:
        content: |
          @echo off
          setlocal
          echo ============================================
          echo   Run Selected Bots
          echo ============================================
          echo.
          echo Enter one or more bot names separated by commas.
          echo Examples:
          echo   linkedin_it
          echo   indeed_it,linkedin_it
          echo   indeed_it,indeed_general,linkedin_general
          echo.
          set /p BOT_NAMES=Bot names: 
          if "%BOT_NAMES%"=="" (
            echo No bots entered.
            pause
            exit /b 1
          )
          cd /d C:\automation\automation_monorepo
          echo.
          echo Running: %BOT_NAMES%
          set BOT_NAMES=%BOT_NAMES:,= %
          for %%B in (%BOT_NAMES%) do C:\Python311\python.exe bot_manager.py start %%B
          echo.
          pause
        dest: 'C:\Users\{{ ansible_user }}\Desktop\Run Selected Bots.bat'

    - name: Refresh per-bot run shortcuts on Desktop
      ansible.windows.win_copy:
        content: |
          @echo off
          echo Starting {{ item.label }}...
          cd /d C:\automation\automation_monorepo
          C:\Python311\python.exe bot_manager.py start {{ item.name }}
          pause
        dest: 'C:\Users\{{ ansible_user }}\Desktop\Run {{ item.label }}.bat'
      loop:
        - { name: 'indeed_it', label: 'Indeed IT' }
        - { name: 'indeed_general', label: 'Indeed General' }
        - { name: 'glassdoor_it', label: 'Glassdoor IT' }
        - { name: 'linkedin_it', label: 'LinkedIn IT' }
        - { name: 'linkedin_general', label: 'LinkedIn General' }

    - name: Refresh all-bots supervisor shortcuts on Desktop
      ansible.windows.win_copy:
        content: |
          @echo off
          echo Starting all enabled bots...
          cd /d C:\automation\automation_monorepo
          C:\Python311\python.exe bot_manager.py start indeed_it
          C:\Python311\python.exe bot_manager.py start indeed_general
          C:\Python311\python.exe bot_manager.py start glassdoor_it
          C:\Python311\python.exe bot_manager.py start linkedin_it
          C:\Python311\python.exe bot_manager.py start linkedin_general
          pause
        dest: "{{ item }}"
      loop:
        - 'C:\Users\{{ ansible_user }}\Desktop\Run All Enabled Bots.bat'
        - 'C:\Users\{{ ansible_user }}\Desktop\Start Supervisor.bat'

    - name: Refresh manager status shortcut on Desktop
      ansible.windows.win_copy:
        content: |
          @echo off
          cd /d C:\automation\automation_monorepo
          C:\Python311\python.exe bot_manager.py status
          pause
        dest: 'C:\Users\{{ ansible_user }}\Desktop\Bot Status.bat'

    - name: Refresh stop-all shortcut on Desktop
      ansible.windows.win_copy:
        content: |
          @echo off
          cd /d C:\automation\automation_monorepo
          C:\Python311\python.exe bot_manager.py stop-all
          pause
        dest: 'C:\Users\{{ ansible_user }}\Desktop\Stop All Bots.bat'

    - name: Refresh one-cycle debug shortcut on Desktop
      ansible.windows.win_copy:
        content: |
          @echo off
          REM Debug helper: runs selected bots once, then exits.
          setlocal
          echo ============================================
          echo   Debug: Run Selected Bots Once
          echo ============================================
          echo.
          set /p BOT_NAMES=Bot names, comma-separated: 
          if "%BOT_NAMES%"=="" (
            echo No bots entered.
            pause
            exit /b 1
          )
          cd /d C:\automation\automation_monorepo
          C:\Python311\python.exe supervisor.py --only "%BOT_NAMES%" --parallel --once --include-not-ok
          pause
        dest: 'C:\Users\{{ ansible_user }}\Desktop\Debug Run Selected Bots Once.bat'

    - name: Remove confusing old bot shortcuts from Desktop
      ansible.windows.win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - 'C:\Users\{{ ansible_user }}\Desktop\Test Single Bot.bat'
        - 'C:\Users\{{ ansible_user }}\Desktop\Start Supervisor (force, single cycle).bat'

    - name: Stop existing supervisor + bot processes (opt-in)
      # Off by default — sync is code-only. Use the workflow_dispatch input
      # `restart_supervisor=true` (or set the var manually) to bounce bots.
      # Day-to-day: you sync code, then use desktop shortcuts:
      #   1. "Setup Bot Logins.bat"   → python live_e2e_logins.py
      #   2. "Start Supervisor.bat"   → python supervisor.py --parallel
      ansible.windows.win_shell: |
        $procs = Get-WmiObject Win32_Process | Where-Object { $_.CommandLine -like '*supervisor.py*' -or $_.CommandLine -like '*bot_manager.py*' -or $_.CommandLine -like '*bots\*.py*' }
        foreach ($p in $procs) {
          Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          Write-Output "Stopped PID $($p.ProcessId)"
        }
        if (-not $procs) { Write-Output "No supervisor/bot processes found" }
      when: restart_supervisor | default(false) | bool
      ignore_errors: true

    - name: Start supervisor in background (opt-in, parallel mode)
      ansible.windows.win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
        Start-Process -FilePath "python" `
          -ArgumentList "supervisor.py","--parallel","--include-not-ok" `
          -WorkingDirectory "{{ monorepo_dir }}" `
          -WindowStyle Normal `
          -RedirectStandardOutput "{{ monorepo_dir }}\logs\supervisor_stdout.log" `
          -RedirectStandardError  "{{ monorepo_dir }}\logs\supervisor_stderr.log"
        Write-Output "Supervisor started in --parallel mode"
      when: restart_supervisor | default(false) | bool
      ignore_errors: true
