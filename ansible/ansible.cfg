# ansible.cfg — Performance-tuned configuration for job-automation-bots
# Placed in ansible/ so it's auto-detected when running from this directory,
# or explicitly via ANSIBLE_CONFIG=ansible/ansible.cfg from repo root.

[defaults]
# Increase parallel host limit (default 5 → 30)
# Even with a single VM target, higher forks reduce internal scheduling overhead.
forks = 30

# Skip automatic fact gathering unless a play explicitly sets gather_facts: true.
# Our playbooks don't use Ansible facts (all PATH/env is refreshed manually via
# win_shell), so this eliminates a ~5 s WinRM round-trip per play.
gathering = explicit

# Use YAML stdout for cleaner CI logs. The old community.general.yaml
# callback was removed in community.general 12; ansible-core's default
# callback now provides the same formatting via result_format.
stdout_callback = ansible.builtin.default

# Disable retry files — CI runners are ephemeral, .retry files are useless
retry_files_enabled = False

# Default task timeout (seconds)
timeout = 60

[ssh_connection]
# Enable SSH pipelining — executes multiple tasks over a single SSH connection
# instead of opening a new one per task. Only activates for SSH transport;
# harmless when using WinRM (our current setup). Enables future SSH use cases
# since OpenSSH is installed on the VM.
pipelining = True

[callback_default]
result_format = yaml
